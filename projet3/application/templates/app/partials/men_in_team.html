{% load static %}

<section style="background-color:#FFC300">
  <h1>Joueurs avec équipes</h1>
  <div class="row row-cols-5 d-flex justify-content-evenly mx-0">
    {% for homme in hommes_avec_equipe %}
    <!-- *** fut-player-card ***-->
    <div class="fut-player-card">
        <!-- Player Card Top-->
        <div class="player-card-top">
            <div class="player-master-info">
                <div class="player-rating"><span>97</span></div>
                <div class="player-position"><span>{{homme.role}}</span></div>
                <div class="player-club"><img src="{% static homme.equipe.image.url %}" alt="{{homme.equipe}}" draggable="false" /></div>
                <div class="player-nation"><img src="{{homme.country_of_origin.flag}}" alt="{{homme.country_of_origin.name}}"></div>
            </div>
            <div class="player-picture"><img src="{% static homme.image %}"  alt="{{homme.first_name}} {{homme.last_name}}" draggable="false" style="object-fit:cover; transform:scale(1.2); object-position: top" />
            </div>
        </div><!-- Player Card Bottom-->
        <div class="player-card-bottom">
            <div class="player-info">
                <!-- Player Name-->
                <div class="player-name"><span>{{homme.first_name|truncatechars:12}} {{homme.last_name}}</span></div><!-- Player Features-->
                <div class="player-features">
                    <div class="player-features-col"><span>
                            <div class="player-feature-value">{{homme.vitesse}}</div>
                            <div class="player-feature-title">PAC</div>
                        </span><span>
                            <div class="player-feature-value">{{homme.tir}}</div>
                            <div class="player-feature-title">SHO</div>
                        </span><span>
                            <div class="player-feature-value">{{homme.passes}}</div>
                            <div class="player-feature-title">PAS</div>
                        </span></div>
                    <div class="player-features-col"><span>
                            <div class="player-feature-value">{{homme.dribble}}</div>
                            <div class="player-feature-title">DRI</div>
                        </span><span>
                            <div class="player-feature-value">{{homme.defense}}</div>
                            <div class="player-feature-title">DEF</div>
                        </span><span>
                            <div class="player-feature-value">{{homme.physique}}</div>
                            <div class="player-feature-title">PHY</div>
                        </span></div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
  </div>
</section>
