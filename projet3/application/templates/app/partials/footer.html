{% load static %}

<footer class="bg-black">
    <div class="row row-cols-4 w-100 text-white py-5 pe-5" style="background-image: url({% static 'leftduck.png' %}); background-repeat: no-repeat; background-size: none; background-position: left center">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col">
            <div class="d-flex gap-3 align-items-center">
                <h2>Socials</h2>
                <div class="border border-white" style="width: 40%; height: 1px;"></div>
            </div>
            <div class="d-flex align-items-center gap-5 my-4 flex-wrap">
                <a href="#" class="link-light">
                    <i class="fab fa-facebook fa-2xl"></i>
                </a>
                <a href="#" class="link-light">
                    <i class="fab fa-twitter fa-2xl"></i>
                </a>
                <a href="#" class="link-light">
                    <i class="fab fa-instagram fa-2xl"></i>
                </a>
                <a href="#" class="link-light">
                    <i class="fab fa-tiktok fa-2xl"></i>
                </a>
            </div>
        </div>
        <div class="col">
            <div class="d-flex gap-3 align-items-center">
                <h2>Subscribe</h2>
                <div class="border border-white" style="width: 40%; height: 1px;"></div>
            </div>

            <div class="input-group mt-3 mb-5">
                <input type="text" class="form-control" placeholder="E-mail" aria-label="Recipient's username" aria-describedby="button-addon2">
                <button class="btn btn-outline-light rounded" type="button" id="button-addon2">Subscribe</button>
            </div>

            <div class="d-flex align-items-center gap-5 my-4">
                <img src="{% static 'logo/Sans_tUELOGO.png' %}" alt="logo" class="img-fluid w-25">
                <span class="fs-4">ULTIMATE TEAMS &copy; 2023</span>
            </div>
