{% extends 'backend.html' %}
{% load static %}
{% block content %}
<div class="equipes position-relative">
    <video src={% static 'europa.mp4' %} autoplay muted loop style="position: absolute; right:0; bottom:0; width: 100%; height: 100%; object-fit:cover; z-index: -1"></video>
        <section id="european-teams" class="p-5 position-relative w-100">
            <div>
                <h1 class="text-white mb-5"> ALL TEAMS </h1>
            </div>
            
            <div class="container">
                <div class="row row-cols-5 d-flex justify-content-evenly mx-0">
                {% for equipe in equipes %}
                    <a href="{% url 'update_team' equipe.id %}" class="text-decoration-none">
                        <div class="equipe text-center d-flex flex-column align-items-center">
                            <img src="{{equipe.image.url}}" alt="" style="width: 60%;  filter:drop-shadow(0 0 5px white);">
                            <span style="font-weight: bold; font-size: 1.2rem; text-shadow: 0 0 5px black" class="mt-4 text-light">{{equipe.name}}</span>
                        </div>
                    </a>
                {% endfor %}
                </div>
            </div>
        </section>
    </div>
{% endblock %}
